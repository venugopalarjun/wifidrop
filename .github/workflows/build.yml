name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk WifiDrop.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WifiDrop
          path: WifiDrop.apk
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest WifiDrop.apk mac/wifidrop.sh --title "WifiDrop" --notes "Phone app (WifiDrop.apk) and Mac sender script (wifidrop.sh)."
